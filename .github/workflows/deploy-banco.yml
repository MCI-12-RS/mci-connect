# Deploy de produção, parte 1 de 2: banco (Supabase).
# Actions → "Deploy: banco (Supabase)" → Run workflow.
#
# Ordem:
#   1. confere o Auth de produção (provedor de e-mail desligado, E1.04 RN-14 e
#      DT-13); falha cedo, inclusive com "somente plano";
#   2. mostra as migrations pendentes no resumo da execução;
#   3. aplica as migrations (`supabase db push`);
#   4. apaga as Edge Functions de EDGE_FUNCTIONS_REMOVED (idempotente);
#   5. publica as Edge Functions de EDGE_FUNCTIONS.
# Com "somente plano", só os passos 1 e 2 rodam. Depois rode "Deploy: promote
# (Vercel)" para colocar o front no ar.
#
# Os passos 1 e 4 usam a Management API com SUPABASE_ACCESS_TOKEN. A resposta da
# configuração do Auth tem segredos: o corpo nunca é impresso, só o campo lido.
#
# Configuração no GitHub (Settings → Secrets and variables → Actions):
#   secrets:   SUPABASE_DB_URL (pooler, com senha), SUPABASE_ACCESS_TOKEN
#   variables: SUPABASE_PROJECT_REF
#
# A Supabase CLI lê variáveis SUPABASE_* do ambiente como configuração dela, por
# isso a URL do banco é passada como DB_URL, e não como SUPABASE_DB_URL.

name: "Deploy: banco (Supabase)"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag ou commit cujas migrations e funções serão publicadas
        required: true
        default: main
      somente_plano:
        description: Só mostrar o que seria feito (dry run), sem alterar nada
        type: boolean
        default: false
      publicar_funcoes:
        description: Publicar as Edge Functions da lista
        type: boolean
        default: true

concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.58.5
  # Lista explícita de funções publicadas. change-member-password fica de fora
  # até o passo E2.03 do plano de migração.
  EDGE_FUNCTIONS: create-user-admin sign-in
  # Funções apagadas do projeto a cada execução (E1.04, RN-16). Tirar uma função
  # de EDGE_FUNCTIONS não apaga a versão publicada, e um rollback do app não a
  # publica de novo. get-user-email saiu porque foi substituída pela sign-in.
  EDGE_FUNCTIONS_REMOVED: get-user-email

jobs:
  banco:
    name: Banco e Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Sempre roda, também com "somente plano", e antes das migrations.
      # Nunca imprime o corpo da resposta (tem segredos de SMTP e de provedores).
      - name: Conferir o Auth (provedor de e-mail desligado)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          status=$(curl -sS -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth") || status=000
          if [ "$status" != "200" ]; then
            echo "::error::Não foi possível ler a configuração do Auth (HTTP $status)."
            echo "Auth: não foi possível ler a configuração (HTTP $status)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          email=$(jq -r '.external_email_enabled
            | if . == false then "desligado"
              elif . == true then "ligado"
              elif . == null then "ausente"
              else "valor inesperado" end' "$body" 2>/dev/null) || email="resposta ilegível"
          if [ "$email" != "desligado" ]; then
            echo "::error::O provedor de e-mail do Auth precisa estar desligado (external_email_enabled = false); está: $email."
            echo "Auth: provedor de e-mail $email. Desligue antes de publicar (E1.04, RN-14)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Auth: provedor de e-mail desligado." >> "$GITHUB_STEP_SUMMARY"

      - name: Plano (dry run)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          for fn in $EDGE_FUNCTIONS_REMOVED; do
            if [[ " $EDGE_FUNCTIONS " == *" $fn "* ]]; then
              echo "::error::$fn está em EDGE_FUNCTIONS e em EDGE_FUNCTIONS_REMOVED."
              exit 1
            fi
          done
          out=$(supabase db push --db-url "$DB_URL" --dry-run 2>&1)
          echo "$out"
          {
            echo "## Banco (Supabase) — commit \`$(git rev-parse --short HEAD)\`"
            echo '```'
            echo "$out"
            echo '```'
            if [ "${{ inputs.publicar_funcoes }}" = "true" ]; then
              echo "Edge Functions: \`${EDGE_FUNCTIONS}\`"
            else
              echo "Edge Functions: não serão publicadas."
            fi
            echo "Edge Functions a apagar (se existirem): \`${EDGE_FUNCTIONS_REMOVED}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Aplicar migrations
        if: ${{ !inputs.somente_plano }}
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$DB_URL" --yes

      # Idempotente: função que já não existe (404) não é erro. Qualquer outro
      # status falha o job. Roda mesmo sem "publicar_funcoes" (RN-16).
      - name: Apagar Edge Functions retiradas
        if: ${{ !inputs.somente_plano }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          api="https://api.supabase.com/v1/projects/$PROJECT_REF/functions"
          call() {
            local s
            s=$(curl -sS -o "$body" -w '%{http_code}' -X "$1" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api/$2") || s=000
            echo "$s"
          }
          echo "### Edge Functions retiradas" >> "$GITHUB_STEP_SUMMARY"
          for fn in $EDGE_FUNCTIONS_REMOVED; do
            status=$(call GET "$fn")
            case "$status" in
              404)
                echo "- \`$fn\`: já não existia." >> "$GITHUB_STEP_SUMMARY"
                continue ;;
              200) ;;
              *)
                echo "::error::Não foi possível consultar a função $fn (HTTP $status)."
                echo "- \`$fn\`: falha ao consultar (HTTP $status)." >> "$GITHUB_STEP_SUMMARY"
                exit 1 ;;
            esac
            status=$(call DELETE "$fn")
            case "$status" in
              200|204) echo "- \`$fn\`: apagada." >> "$GITHUB_STEP_SUMMARY" ;;
              404) echo "- \`$fn\`: já não existia." >> "$GITHUB_STEP_SUMMARY" ;;
              *)
                echo "::error::Não foi possível apagar a função $fn (HTTP $status)."
                echo "- \`$fn\`: falha ao apagar (HTTP $status)." >> "$GITHUB_STEP_SUMMARY"
                exit 1 ;;
            esac
          done

      - name: Publicar Edge Functions
        if: ${{ !inputs.somente_plano && inputs.publicar_funcoes }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          for fn in $EDGE_FUNCTIONS; do
            echo "::group::$fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done
          echo "Edge Functions publicadas: \`${EDGE_FUNCTIONS}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Resultado
        if: ${{ inputs.somente_plano }}
        run: |
          echo "Somente plano: nada foi alterado." >> "$GITHUB_STEP_SUMMARY"
