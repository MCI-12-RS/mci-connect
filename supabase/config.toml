project_id = "gkhnjhmgeceoaqeynhrj"

# A verificação do JWT é feita dentro da função (auth.getUser), que funciona
# com as chaves antigas e com as novas (publishable/secret). Ver o cabeçalho de
# supabase/functions/create-user-admin/index.ts.
[functions.create-user-admin]
verify_jwt = false

# Login por e-mail, celular ou CPF (E1.04). A tela chama a função antes do
# login, só com a chave pública (que não é um JWT).
[functions.sign-in]
verify_jwt = false

# Troca da própria senha (E2.03). O JWT é conferido dentro da função
# (auth.getUser), como na create-user-admin.
[functions.change-own-password]
verify_jwt = false

# Só para a stack local (E1.04, DT-13). A configuração do Auth de produção é
# feita pela Management API, no roteiro de implantação, e conferida pelo
# "Deploy: banco". Nunca use `supabase config push`: este arquivo não tem as
# demais opções de produção e as sobrescreveria.
# Limite de /verify por IP: alto aqui para os testes locais de login em rajada.
[auth.rate_limit]
token_verifications = 1000

# Só para a stack local (E1.04, RN-14 e DT-13): desliga o login com e-mail e
# senha direto no Auth (é o GOTRUE_EXTERNAL_EMAIL_ENABLED=false da stack local).
# O app entra só pela função sign-in. Em produção, o equivalente é
# `external_email_enabled = false`, aplicado pela Management API no roteiro de
# implantação (passo B). Nunca use `supabase config push`.
[auth.email]
enable_signup = false
